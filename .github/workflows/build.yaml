name: Build XForensics

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Solution
      run: dotnet build XForensics.slnx -c Release

    - name: Publish XForensics.App
      run: dotnet publish XForensics.App/XForensics.App.csproj -c Release -o publish --self-contained false

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: XForensics-Release
        path: publish/
